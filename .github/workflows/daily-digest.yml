name: Daily Agents Radar

on:
  schedule:
    # 22:37 UTC daily = 06:37 CST (UTC+8) the next day. A ~20 min run started
    # then lands the digest around 07:00 CST, which is when it is expected.
    #
    # The minute is deliberately off the hour. GitHub queues scheduled runs and
    # drops them under load, and the :00 slot is the most contended one. At
    # "0 23 * * *" this workflow degraded badly in August 2026: the 08-26 run
    # was dispatched 5h07m late and the 08-27 run was never created at all.
    # qwen-flash has flat pricing, so moving the slot costs nothing (it would
    # have, under DeepSeek's peak/off-peak scheme).
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# A late scheduled run must not overlap a manual catch-up run: both would build
# the same CST day's digest and open a duplicate set of issues (as happened on
# 2026-08-27, which produced 18 duplicates). Queue rather than cancel, so the
# scheduled run reaches the guard job below only after the manual one has
# committed its digest — and then skips.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}

    steps:
      - name: Skip a scheduled run when today's digest already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event is ${{ github.event_name }} — manual runs always proceed."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # CST date, matching the digests/YYYY-MM-DD/ folder produced by toCstDateStr
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if gh api "repos/${{ github.repository }}/contents/digests/$DATE" --silent 2>/dev/null; then
            echo "digests/$DATE is already committed — a manual run covered today. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No digests/$DATE yet — proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    # ~60 LLM calls per run, serialized to 2 concurrent against a free tier that
    # 429s at 5 (see LLM_CONCURRENCY below), plus sitemap diffing and article
    # fetches. Upstream's 40-min ceiling is sized for a commercial endpoint;
    # headroom here keeps a slow-but-healthy run from being cancelled mid-write.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ModelScope API-Inference (free tier) speaks the OpenAI protocol, so it
          # runs through the built-in `openai` provider rather than a new file.
          #
          # Model choice is dictated by two measured traps on this endpoint:
          #   1. Qwen3.8-Flash-Next spends the whole output budget on reasoning
          #      and returns an empty `content` (finish_reason=length) — 18/20
          #      failed calls on the 2026-09-12 first run.
          #   2. Qwen3-Next-80B-A3B-Instruct was withdrawn on 2026-09-16 with
          #      "400 Model id has no provider supported" — 19/19 calls failed.
          # DeepSeek-V4.1-Flash answered every real probe with finish_reason=stop
          # and its reasoning tokens do not consume max_completion_tokens, which
          # is why the budgets in src/report.ts were raised. The endpoint's model
          # list churns; check /v1/models before blaming the code.
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api-inference.modelscope.cn/v1
          OPENAI_MODEL: deepseek-ai/DeepSeek-V4.1-Flash
          # The free tier 429s at 5 concurrent (measured 4 ok / 1 on 2026-09-12 and
          # 3 ok / 2 on 2026-09-16), which is exactly upstream's hard-coded limiter
          # size. Two slots keeps the retry ladder from being the thing that
          # absorbs it on every report.
          LLM_CONCURRENCY: "2"
          PRODUCTHUNT_TOKEN: ${{ secrets.PRODUCTHUNT_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm start

      - name: Commit digest files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            # CST date, matching the digests/YYYY-MM-DD/ folder produced by toCstDateStr
            DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
            git commit -m "digest: ${DATE} daily digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest
        run: pnpm manifest

      - name: Commit manifest and feed
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: https://kouweizhu.github.io/agents-radar
        run: pnpm notify

      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK_URLS: ${{ secrets.FEISHU_WEBHOOK_URLS }}
          PAGES_URL: https://kouweizhu.github.io/agents-radar
        run: pnpm notify:feishu

      - name: Close stale issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm close-stale

